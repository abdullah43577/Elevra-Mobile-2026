name: Elevra Workflow Update

# Only dev. A push to master cuts a production build instead
# (.github/workflows/build.yml); a production OTA hotfix is a deliberate
# `eas update --branch production`, not a side effect of merging.
#
# The channel is still derived from the ref rather than hardcoded, so running
# this by hand from master (`eas workflow:run`) still targets production.s
on:
  push:
    branches: ["dev"]

jobs:
  send_updates:
    name: Send updates to mobile app
    type: update
    environment: "preview"
    params:
      channel: ${{ github.ref == 'refs/heads/master' && 'production' || 'preview' }}
